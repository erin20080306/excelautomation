services:
  - type: keyvalue
    name: excelautomation-redis
    plan: free
    region: singapore
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: off

  - type: web
    name: excelautomation-backend
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./apps/backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    maxShutdownDelaySeconds: 60
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          name: excelautomation-redis
          type: keyvalue
          property: connectionString
      - key: PARSER_URL
        value: http://127.0.0.1:8000
      - key: STORAGE_DRIVER
        value: database
      - key: STORAGE_LOCAL_PATH
        value: /tmp/excelmaster-storage
      - key: WEB_ORIGIN
        value: https://excelautomation-api-seven.vercel.app
      - key: JWT_SECRET
        generateValue: true
      - key: FIELD_ENCRYPTION_KEY
        generateValue: true
      - key: MAX_FILE_SIZE_MB
        value: 50
      - key: MAX_ZIP_UNCOMPRESSED_MB
        value: 500
      - key: WORKER_CONCURRENCY
        value: 2
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_ADMIN_NAME
        value: 測試管理者
      - key: SEED_WORKSPACE_NAME
        value: ExcelMaster 測試工作區
      - key: ALLOW_PRODUCTION_SEED
        value: true

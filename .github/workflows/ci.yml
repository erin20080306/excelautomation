name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/parser/requirements.txt

      - run: npm ci
      - run: python -m venv apps/parser/.venv
      - run: apps/parser/.venv/bin/pip install -r apps/parser/requirements.txt
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
